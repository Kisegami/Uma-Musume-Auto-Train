race_thumbnail_matching:
  purpose: "Match one known target race thumbnail against the visible race-card column."
  source_templates_dir: "assets/races/races_thumb"
  scaled_templates_dir: "assets/races/race_thumb_scaled"
  map_file: "assets/races/race_thumbnail_map.json"

  preprocessing:
    crop_inset_px: 8
    scale: 0.52
    interpolation: "cv2.INTER_AREA"
    output_size_px:
      width: 258
      height: 125
    alpha_handling: "Load scaled PNG with cv2.IMREAD_COLOR for matching."

  template_matching:
    method: "cv2.TM_CCOEFF_NORMED"
    search_region_xywh:
      x: 0
      y: 1000
      width: 369
      height: 543
    recommended_min_score: 0.80
    expected_card_width_px: 258
    expected_card_height_px: 125
    nms_distance_px: 80

  usage:
    lookup_flow:
      - "Use race name to find thumbnail_path in race_thumbnail_map.json."
      - "Replace assets/races/races_thumb with assets/races/race_thumb_scaled."
      - "Match only that one scaled template in search_region_xywh."
      - "Treat scores >= recommended_min_score as a strong match."
    regenerate_scaled_templates_command: "python tests/generate_scaled_race_thumbnails.py --overwrite"

  verified_examples:
    - screenshot: "tests/race_template_test.png"
      matches:
        - race_name: "Heian Stakes"
          period: "Senior Year Late May"
          scaled_template: "assets/races/race_thumb_scaled/thum_race_rt_000_3029_00.png"
          score: 0.8881
          box_xywh: [70, 1104, 258, 125]
        - race_name: "Meguro Kinen"
          period: "Senior Year Late May"
          scaled_template: "assets/races/race_thumb_scaled/thum_race_rt_000_2019_00.png"
          score: 0.8730
          box_xywh: [70, 1334, 258, 125]
    - screenshot: "tests/race_template_test_2.png"
      matches:
        - race_name: "Senryo Sho"
          period: "Junior Year Late Dec"
          scaled_template: "assets/races/race_thumb_scaled/thum_race_rt_000_4526_00.png"
          score: 0.8784
          box_xywh: [70, 1104, 258, 125]
        - race_name: "Hopeful Stakes"
          period: "Junior Year Late Dec"
          scaled_template: "assets/races/race_thumb_scaled/thum_race_rt_000_1024_00.png"
          score: 0.8622
          box_xywh: [70, 1335, 258, 125]

  benchmark:
    environment_note: "Measured locally on race_template_test_2.png with two pre-scaled target templates."
    old_region_xywh: [0, 900, 1080, 700]
    old_region_avg_ms_for_two_templates: 75.73
    old_region_avg_ms_per_template: 37.86
    selected_region_xywh: [0, 1000, 369, 543]
    selected_region_avg_ms_for_two_templates: 23.26
    selected_region_avg_ms_per_template: 11.63
    selected_region_speedup_vs_old_region: 3.25
